[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "nemisis"
version = "0.2.0"
description = "Deterministic evidence for AI patches and crash/retry counterexamples"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "contree-client[httpx]==0.3.0",
  "openai>=1,<3",
  "pydantic>=2.11,<3",
  "pytest>=9.0.3,<10",
]

[project.urls]
Homepage = "https://github.com/Alex-lop/Nemisis"
Repository = "https://github.com/Alex-lop/Nemisis"
Issues = "https://github.com/Alex-lop/Nemisis/issues"
Security = "https://github.com/Alex-lop/Nemisis/security/advisories/new"

[project.scripts]
nemisis = "nemisis.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.sdist]
# A published sdist is the package and its paperwork, not a copy of the repository. The default
# shipped docs/, tests/, site/, benchmarks/, .github/, and whatever untracked Markdown happened to
# be in the working tree when someone ran `uv build`. Everything left out lives in Git, where it
# can be read against the commit that produced it.
#
# Hatchling force-includes two more files no config can drop: PKG-INFO, and the VCS ignore file
# (`SdistBuilder.get_default_build_data`, hatchling 1.32.0). tests/test_release.py allows exactly
# those two and fails on anything else.
include = [
  "/src/nemisis",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nemisis"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["src/nemisis/fixtures/"]

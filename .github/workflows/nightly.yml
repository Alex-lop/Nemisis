# Nightly red team: a few hundred generated handlers against the checker, judged by the oracle.
# A disagreement is either a checker false pass or false fail (the most valuable bug this
# repository can find) or an oracle bug; either way the job fails and the handlers are uploaded.
name: Nightly red team

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: How many handlers to generate
        default: "300"
      seed:
        description: Generator seed (defaults to the run id)
        default: ""

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One sweep per audited scenario; the grammar speaks each one's vocabulary.
        scenario: ["sqlite-credit-v1", "sqlite-inventory-v1"]
    name: redteam (${{ matrix.scenario }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - name: Generate, run, and compare
        shell: bash
        env:
          CASES: ${{ inputs.cases || '300' }}
          SEED: ${{ inputs.seed || github.run_id }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          uv run nemisis redteam --cases "$CASES" --seed "$SEED" --scenario "$SCENARIO" \
            --out "$RUNNER_TEMP/redteam" | tee redteam.txt
          {
            echo "## Nightly red team ($SCENARIO)"
            echo
            echo '```'
            tail -n 5 redteam.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the handlers and their evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redteam-${{ matrix.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}/redteam
          if-no-files-found: warn
          retention-days: 14

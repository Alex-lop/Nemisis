# Publishes the site (index.html + site/) and the committed evidence viewer
# (docs/assets/crashcheck-hero/) to GitHub Pages.
#
# The viewer is static and fail-closed: it renders no claim unless the committed manifest and
# benchmark validate in the browser, exactly as when served locally with `python -m http.server`.
# The staging step keeps the same relative layout the page was recorded against, so the paths it
# fetches (`runs/<id>/manifest.json`, `../../../benchmarks/results/crashcheck-v1.json`) resolve.
# The site links to it at docs/assets/crashcheck-hero/.
#
# Nothing deploys until the repository's Pages source is GitHub Actions. The gate reads
# `build_type` from `repos/<owner>/<repo>/pages` and publishes only when it reads "workflow".
# Asking whether that endpoint merely answers is not the same test: the legacy "deploy from a
# branch" source answers it too (`build_type: "legacy"`), so that gate would let this workflow
# and the branch publisher both write the same URL and race over it. Until the source is switched
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions) the workflow reports the
# source it found and exits green without publishing.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - site/**
      - docs/assets/crashcheck-hero/**
      - docs/assets/nemisis-banner-dark.png
      - benchmarks/results/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check whether the Pages source is this workflow
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)"
          if [[ "$build_type" == "workflow" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Pages"
              echo
              echo "Nothing was published: the repository's Pages source is" \
                "\`${build_type:-not enabled}\`, not \`workflow\`."
              echo
              echo "While the source is a branch, that branch is the publisher and this workflow"
              echo "must stay out of the way. Switch it under Settings -> Pages -> Build and"
              echo "deployment -> Source: GitHub Actions, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage the site and the viewer with the relative layout it was recorded against
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        run: bash site/stage.sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

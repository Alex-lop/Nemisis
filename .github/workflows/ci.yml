name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build
      - name: Exercise the local composite action
        id: crashcheck_action
        continue-on-error: true
        uses: ./
        with:
          base: fixture:sqlite-credit-v1/buggy
          candidate: fixture:sqlite-credit-v1/misleading-green
          corrected: fixture:sqlite-credit-v1/atomic
          runner-temp: ${{ runner.temp }}
      - name: Require the action's expected scoped rejection and evidence
        if: always()
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.crashcheck_action.outcome }}
          ARTIFACT_PATH: ${{ steps.crashcheck_action.outputs.artifact-path }}
        run: |
          if [[ "$ACTION_OUTCOME" != "failure" || ! -d "$ARTIFACT_PATH" ]]; then
            echo "Composite action did not return its expected candidate rejection." >&2
            exit 2
          fi
          test "$(find "$ARTIFACT_PATH/runs" -name manifest.json | wc -l)" -eq 1
          test "$(find "$ARTIFACT_PATH/repros" -name capsule.json | wc -l)" -eq 1
      - name: Run the installed-wheel verifier and CrashCheck hero outside the checkout
        shell: bash
        run: |
          mapfile -t wheels < <(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl')
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 2
          fi
          smoke_root="$(mktemp -d "${RUNNER_TEMP%/}/nemisis-wheel.XXXXXX")"
          cd "$smoke_root"
          uv tool run --from "${wheels[0]}" nemisis verify \
            --fixture idempotency-retry \
            --mode local \
            --output-dir "$smoke_root/verify"
          set +e
          uv tool run --from "${wheels[0]}" nemisis check \
            --base fixture:sqlite-credit-v1/buggy \
            --candidate fixture:sqlite-credit-v1/misleading-green \
            --corrected fixture:sqlite-credit-v1/atomic \
            --mode local \
            --output-dir "$smoke_root/artifacts"
          check_status=$?
          set -e
          if [[ "$check_status" -ne 1 ]]; then
            echo "Expected the misleading-green candidate to exit 1, got $check_status." >&2
            exit 2
          fi
          mapfile -t capsules < <(
            find "$smoke_root/artifacts/repros/double-credit" \
              -mindepth 2 -maxdepth 2 -type f -name capsule.json
          )
          if [[ "${#capsules[@]}" -ne 1 ]]; then
            echo "Expected exactly one content-addressed capsule, found ${#capsules[@]}." >&2
            exit 2
          fi
          uv tool run --from "${wheels[0]}" nemisis replay \
            "${capsules[0]}" \
            --source fixture:sqlite-credit-v1/atomic \
            --role corrected \
            --mode local \
            --output-dir "$smoke_root/artifacts"
          # The red-team zoo: a patch that passes the base's kill point must still fail the sweep.
          set +e
          uv tool run --from "${wheels[0]}" nemisis check \
            --base fixture:sqlite-credit-v1/buggy \
            --candidate fixture:sqlite-credit-v1/mark-first \
            --mode local \
            --output-dir "$smoke_root/zoo" | tee "$smoke_root/zoo.txt"
          zoo_status=$?
          set -e
          if [[ "$zoo_status" -ne 1 ]] || ! grep -q "PATCH_FAILED_INVARIANT_BROKEN" "$smoke_root/zoo.txt"; then
            echo "Expected mark-first to exit 1 with PATCH_FAILED_INVARIANT_BROKEN, got $zoo_status." >&2
            exit 2
          fi
